name: Lisa AI DFC Android build

on:
  push:
    branches: [build-lisa-ai-dfc]
    paths:
      - "LisaAIDFC-source.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Verify complete source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s LisaAIDFC-source.zip
          test "$(stat -c %s LisaAIDFC-source.zip)" = "16922"
          echo "94c270984fd7b6f7662f3b5a3e6a13c6e202c33a2bae887e1a7ab9fa447daed7  LisaAIDFC-source.zip" | sha256sum --check -
          unzip -t LisaAIDFC-source.zip

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lisa-source"
          unzip -q LisaAIDFC-source.zip -d "$RUNNER_TEMP/lisa-source"
          test -f "$RUNNER_TEMP/lisa-source/LisaAIDFC/settings.gradle.kts"
          test -f "$RUNNER_TEMP/lisa-source/LisaAIDFC/app/build.gradle.kts"
          test -f "$RUNNER_TEMP/lisa-source/LisaAIDFC/app/src/main/AndroidManifest.xml"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests and assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/lisa-source/LisaAIDFC"
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/lisa-source/LisaAIDFC/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/LisaAIDFC-debug.apk"
          echo "APK_SHA256=$(sha256sum "$APK" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LisaAIDFC-debug-apk
          path: LisaAIDFC-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK and source ZIP release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lisa-ai-dfc-build-${{ github.run_number }}
          name: Lisa AI DFC build ${{ github.run_number }}
          body: |
            Automated debug APK build from branch `build-lisa-ai-dfc`.
            APK SHA-256: ${{ env.APK_SHA256 }}
            The APK was produced after unit tests and APK signature verification.
          prerelease: true
          files: |
            LisaAIDFC-debug.apk
            LisaAIDFC-source.zip
